name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Routing mode. gateway = public LiteLLM (:4000), internal = LiteLLM on
          localhost (self-hosted runner), fcc = FCC proxy (:8080), direct = OpenAI/
          Anthropic/OpenRouter keys with no custom proxy, cloneclove = CloudCLI UI
          API (cloneclove.com) with real API key.
        type: choice
        options:
          - gateway
          - internal
          - fcc
          - direct
          - cloneclove
        default: gateway
      model:
        description: >-
          Model id for the run (provider/model). Empty uses the per-mode default
          (gateway/internal -> litellm/smart-auto, fcc -> deepseek-v4-flash,
          direct -> openrouter/anthropic/claude-sonnet-4-5, cloneclove -> claude
          managed by cloneclove.com).
        type: string
        default: ""
      prompt:
        description: Task prompt. Ignored for comment triggers (the comment is the prompt).
        type: string
        default: ""
      share:
        description: Share the session with OpenCode (default false).
        type: boolean
        default: false

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  opencode:
    name: OpenCode (${{ inputs.mode || 'gateway' }})
    runs-on: ${{ vars.OPENCODE_RUNNER || 'ubuntu-latest' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, '/opencode') ||
         contains(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        (contains(github.event.comment.body, '/opencode') ||
         contains(github.event.comment.body, '/oc')))
    env:
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
      FCC_AUTH_TOKEN: ${{ secrets.FCC_AUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLONECLOVE_API_KEY: ${{ secrets.CLONECLOVE_API_KEY }}
      INPUT_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve model and provider config
        shell: bash
        run: |
          set -euo pipefail
          MODE="${INPUT_MODE:-gateway}"
          MODEL=""
          CONFIG=""
          case "$MODE" in
            internal)
              MODEL="litellm/smart-auto"
              # Self-hosted runner that shares the box with the LiteLLM gateway.
              CONFIG='{"provider":{"litellm":{"npm":"@ai-sdk/openai-compatible","name":"LiteLLM Gateway","options":{"baseURL":"http://127.0.0.1:4000/v1","apiKey":"{env:LITELLM_MASTER_KEY}"},"models":{"smart-auto":{"name":"Smart Auto","limit":{"context":1000000,"output":8192}},"fast-flash":{"name":"Fast Flash","limit":{"context":1000000,"output":8192}},"high-throughput":{"name":"High Throughput","limit":{"context":1000000,"output":8192}}}}}}'
              ;;
            fcc)
              MODEL="fcc/anthropic/opencode_go/deepseek-v4-flash"
              CONFIG='{"provider":{"fcc":{"npm":"@ai-sdk/openai-compatible","name":"FCC Proxy","options":{"baseURL":"http://150.230.171.227:8080","apiKey":"{env:FCC_AUTH_TOKEN}"},"models":{"anthropic/opencode_go/deepseek-v4-flash":{"name":"DeepSeek V4 Flash"},"anthropic/nvidia_nim/deepseek-v4":{"name":"NVIDIA NIM DeepSeek V4"}}}}}'
              ;;
            direct)
              MODEL="openrouter/anthropic/claude-sonnet-4-5"
              CONFIG=""
              ;;
            cloneclove)
              MODEL="claude"
              CONFIG=""
              ;;
            gateway|*)
              MODEL="litellm/smart-auto"
              # Public LiteLLM gateway (reachable from GitHub-hosted runners).
              CONFIG='{"provider":{"litellm":{"npm":"@ai-sdk/openai-compatible","name":"LiteLLM Gateway","options":{"baseURL":"http://150.230.171.227:4000/v1","apiKey":"{env:LITELLM_MASTER_KEY}"},"models":{"smart-auto":{"name":"Smart Auto","limit":{"context":1000000,"output":8192}},"fast-flash":{"name":"Fast Flash","limit":{"context":1000000,"output":8192}},"high-throughput":{"name":"High Throughput","limit":{"context":1000000,"output":8192}}}}}}'
              ;;
          esac
          {
            echo "MODE=${MODE}"
            echo "MODEL=${MODEL}"
            if [ -n "$CONFIG" ]; then
              echo "OPENCODE_CONFIG_CONTENT<<EOF"
              echo "$CONFIG"
              echo "EOF"
            else
              echo "OPENCODE_CONFIG_CONTENT={}"
            fi
          } >> "$GITHUB_ENV"

      - name: Verify provider reachability
        shell: bash
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          set -euo pipefail
          case "${INPUT_MODE:-gateway}" in
            gateway) BASE="http://150.230.171.227:4000/v1" ;;
            internal) BASE="http://127.0.0.1:4000/v1" ;;
            *) exit 0 ;;
          esac
          if [ -z "${LITELLM_MASTER_KEY:-}" ]; then
            echo "::error::LITELLM_MASTER_KEY secret is not set — required for mode ${INPUT_MODE:-gateway}. Set it in repo settings → secrets and variables."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/models" -H "Authorization: Bearer ${LITELLM_MASTER_KEY}")
          if [ "$CODE" != "200" ]; then
            echo "::error::provider check failed: HTTP ${CODE} at ${BASE}. Check the gateway is up and LITELLM_MASTER_KEY holds a valid gateway key."
            exit 1
          fi
          echo "provider OK: ${BASE} (HTTP ${CODE})"

      - name: Run OpenCode
        if: env.MODE != 'cloneclove'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          FCC_AUTH_TOKEN: ${{ secrets.FCC_AUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ env.OPENCODE_CONFIG_CONTENT }}
        with:
          model: ${{ inputs.model || env.MODEL }}
          prompt: ${{ inputs.prompt }}
          share: ${{ inputs.share }}
          use_github_token: true

      - name: Run via cloneclove (real API key)
        if: env.MODE == 'cloneclove'
        shell: bash
        env:
          CLONECLOVE_API_KEY: ${{ secrets.CLONECLOVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: ${{ inputs.prompt || github.event.comment.body }}
        run: |
          set -euo pipefail
          BODY=$(python3 - "$PROMPT" <<'PY'
          import json, sys
          print(json.dumps(sys.argv[1]))
          PY
          )
          echo "::group::cloneclove stream"
          curl -sS --max-time 900 -N -X POST https://cloneclove.com/api/agent \
            -H "X-API-Key: ${CLONECLOVE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"provider\":\"claude\",\"message\":${BODY},\"githubUrl\":\"https://github.com/${GITHUB_REPOSITORY}\",\"githubToken\":\"${GITHUB_TOKEN}\",\"stream\":true}" \
            | tee /tmp/cloneclove-stream.txt
          echo "::endgroup::"
          echo "::group::Assistant output"
          grep '"kind":"text"' /tmp/cloneclove-stream.txt \
            | sed -E 's/^data: //' \
            | python3 -c 'import sys, json
          for line in sys.stdin:
              try: d = json.loads(line)
              except Exception: continue
              c = d.get("content")
              if c: print(c)'
          echo "::endgroup::"
          grep -q '"kind":"complete"' /tmp/cloneclove-stream.txt \
            || { echo "::error::cloneclove agent did not complete"; exit 1; }
