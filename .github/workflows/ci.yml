name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Syntax + import-chain smoke
        run: bash scripts/ci.sh

  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secret patterns
        run: |
          set -euo pipefail
          HITS=$(grep -rIlE 'ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{32,}|aero_live[A-Za-z0-9]+|ya29\.[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            --exclude='*.ipynb' . || true)
          if [ -n "$HITS" ]; then
            echo "Potential secrets found in:"
            echo "$HITS"
            exit 1
          fi
          echo "No secret patterns found."

      - name: Scan full history for secret patterns
        run: |
          set -euo pipefail
          if git rev-list --all | xargs git grep -lE 'ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{32,}|aero_live[A-Za-z0-9]+' -- 2>/dev/null; then
            echo "ERROR: secret pattern found in git history."
            exit 1
          fi
          echo "No secret patterns in history."
