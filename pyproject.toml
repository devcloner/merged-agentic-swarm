[project]
name = "merged-agentic-swarm"
version = "1.2.0"
description = "Multi-agent orchestration system with 5-phase workflow, 40-worker pools, and cold-path knowledge promotion"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/merged_agentic_swarm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "requests>=2.31.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
