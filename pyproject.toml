[project]
name = "merged-agentic-swarm"
version = "1.1.1"
description = "Multi-agent orchestration system with 5-phase workflow, 40-worker pools, and cold-path knowledge promotion"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["models/", "providers/", "proxy/", "services/", "tools/", "tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
