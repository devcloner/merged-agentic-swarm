[project]
name = "merged-agentic-swarm"
version = "1.4.0"
description = "Multi-agent orchestration system with 5-phase workflow, 40-worker pools, and cold-path knowledge promotion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-cli = "merged_agentic_swarm.tools.agentic_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/merged_agentic_swarm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "requests>=2.31.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001",      # blind Exception — intentional in service boundaries / fallback paths
    "S110",        # try-except-pass — acceptable in best-effort paths
    "S112",        # try-except-continue — acceptable in batch processing
    "RUF012",      # mutable class attribute — intentional shared defaults
    "PLW1510",     # subprocess.run without check — non-zero exits handled downstream
    "EXE001",      # shebang vs permission — deploy-time concern, not lint
    "EXE002",      # permission vs shebang — deploy-time concern, not lint
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
